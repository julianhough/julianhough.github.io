<!DOCTYPE html>
<html>
<head>
<title>Music tracks</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: #f2f2f2;
  margin: 0;
  padding: 24px;
  color: #222;
}
.container {
  max-width: 900px;
  margin: 0 auto;
  background: #fff;
  padding: 24px;
  border-radius: 10px;
  box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
}
h1 {
  margin-top: 0;
}
p.description {
  margin: 0 0 20px;
  color: #555;
}
table {
  width: 100%;
  border-collapse: collapse;
}
th, td {
  border: 1px solid #d1d1d1;
  padding: 12px 14px;
}
th {
  background: #e6e6e6;
  text-align: left;
}
.audio-cell {
  display: flex;
  align-items: center;
  gap: 10px;
}
button {
  font: inherit;
  padding: 8px 14px;
  border: 1px solid #999;
  border-radius: 6px;
  background: #fff;
  cursor: pointer;
  height: 40px;
  font-size: 18px;
  line-height: 1;
}
.track-button {
  width: 48px;
}
.track-progress {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 10px;
}
.track-progress input[type="range"] {
  width: 100%;
  appearance: none;
  height: 10px;
  border-radius: 6px;
  background: #b0b0b0;
  cursor: pointer;
}
.track-progress input[type="range"]::-webkit-slider-thumb {
  appearance: none;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: #4a90e2;
  cursor: pointer;
  margin-top: -2px;
}
.track-progress input[type="range"]::-moz-range-thumb {
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: #4a90e2;
  cursor: pointer;
}
.track-progress .time {
  min-width: 100px;
  color: #444;
  font-size: 13px;
}
button:hover {
  background: #f3f3f3;
}
.play-all-button {
  width: auto;
  height: auto;
  font-size: 17px;
  font-weight: 600;
  padding: 12px 20px;
  margin-bottom: 18px;
  background: #333;
  color: #fff;
  border-color: #222;
}
.play-all-button:hover {
  background: #222;
}
</style>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const buttons = document.querySelectorAll('button[data-audio-id]');
  const tracks = Array.from(document.querySelectorAll('audio'));
  const playAllButton = document.getElementById('playAll');
  let playAllActive = false;
  let playAllIndex = 0;

  const formatTime = (seconds) => {
    if (!Number.isFinite(seconds)) return '--:--';
    const mins = Math.floor(seconds / 60);
    const secs = Math.floor(seconds % 60);
    return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
  };

  const stopOtherTracks = (currentAudio) => {
    tracks.forEach(track => {
      if (track !== currentAudio) {
        track.pause();
      }
    });
  };

  buttons.forEach(button => {
    const audio = document.getElementById(button.dataset.audioId);
    if (!audio) return;
    const progress = button.parentElement.querySelector('input[type="range"]');
    const timeDisplay = button.parentElement.querySelector('.time');

    const updateTime = () => {
      const currentTime = formatTime(audio.currentTime);
      const duration = formatTime(audio.duration);
      if (progress) {
        progress.value = audio.duration ? (audio.currentTime / audio.duration) * 100 : 0;
      }
      if (timeDisplay) {
        timeDisplay.textContent = `${currentTime} / ${duration}`;
      }
    };

    button.addEventListener('click', () => {
      playAllActive = false;
      const shouldPlay = audio.paused;
      stopOtherTracks(audio);
      if (shouldPlay) {
        audio.play();
      } else {
        audio.pause();
      }
    });

    if (progress) {
      progress.addEventListener('input', (event) => {
        const activeTrack = tracks.find(track => !track.paused && !track.ended);
        if (activeTrack && activeTrack !== audio) return;
        if (!audio.duration) return;
        const ratio = Number(event.target.value) / 100;
        audio.currentTime = ratio * audio.duration;
      });
    }

    audio.addEventListener('loadedmetadata', updateTime);
    audio.addEventListener('timeupdate', updateTime);
    audio.addEventListener('play', () => {
      button.textContent = '⏸';
    });
    audio.addEventListener('pause', () => {
      button.textContent = '▶';
      if (playAllActive && !audio.ended) {
        playAllActive = false;
      }
    });
    audio.addEventListener('ended', () => {
      button.textContent = '▶';
      updateTime();
      if (playAllActive && tracks[playAllIndex] === audio) {
        playAllIndex += 1;
        if (playAllIndex < tracks.length) {
          tracks[playAllIndex].play();
        } else {
          playAllActive = false;
        }
      }
    });

    button.textContent = '▶';
    updateTime();
  });

  playAllButton.addEventListener('click', () => {
    playAllActive = true;
    playAllIndex = 0;

    tracks.forEach(track => {
      track.pause();
      track.currentTime = 0;
    });

    document.querySelectorAll('input[type="range"]').forEach(range => {
      range.value = 0;
    });
    document.querySelectorAll('.time').forEach(timeEl => {
      timeEl.textContent = '00:00 / --:--';
    });
    document.querySelectorAll('button[data-audio-id]').forEach(btn => {
      btn.textContent = '▶';
    });

    stopOtherTracks(tracks[0]);
    tracks[0].play();
  });
});
</script>
</head>
<body>
<div class="container">
  <h1>Music tracks</h1>
  <p class="description">Simple Jukebox player.</p>
  <button id="playAll" class="play-all-button" type="button">Play all in order</button>
  <table>

    </tbody>
  </table>
</div>
</body>
</html>
